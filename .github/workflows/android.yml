name: Сборка APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Обновить содержимое приложения из index.html
        run: cp index.html android/app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Переименовать файл
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/dvoe.apk

      - name: Приложить APK к сборке
        uses: actions/upload-artifact@v4
        with:
          name: dvoe-apk
          path: out/dvoe.apk
          retention-days: 90

      - name: Опубликовать в разделе Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Двое — последняя версия
          files: out/dvoe.apk
          make_latest: true
