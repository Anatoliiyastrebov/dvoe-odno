name: Сборка APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Скачать полный текст Библии (синодальный перевод)
        run: |
          python3 - <<'PYEOF'
          import json, os, re, io, zipfile, urllib.request

          CANON = ["Бытие","Исход","Левит","Числа","Второзаконие","Иисуса Навина","Судей","Руфь",
          "1-я Царств","2-я Царств","3-я Царств","4-я Царств","1-я Паралипоменон","2-я Паралипоменон",
          "Ездры","Неемии","Есфирь","Иов","Псалтирь","Притчи","Екклесиаст","Песнь Песней","Исаии",
          "Иеремии","Плач Иеремии","Иезекииля","Даниила","Осии","Иоиля","Амоса","Авдия","Ионы","Михея",
          "Наума","Аввакума","Софонии","Аггея","Захарии","Малахии","От Матфея","От Марка","От Луки",
          "От Иоанна","Деяния","Иакова","1-е Петра","2-е Петра","1-е Иоанна","2-е Иоанна","3-е Иоанна",
          "Иуды","Римлянам","1-е Коринфянам","2-е Коринфянам","Галатам","Ефесянам","Филиппийцам",
          "Колоссянам","1-е Фессалоникийцам","2-е Фессалоникийцам","1-е Тимофею","2-е Тимофею","Титу",
          "Филимону","Евреям","Откровение"]

          USFM_ORDER = ["GEN","EXO","LEV","NUM","DEU","JOS","JDG","RUT","1SA","2SA","1KI","2KI","1CH","2CH",
          "EZR","NEH","EST","JOB","PSA","PRO","ECC","SNG","ISA","JER","LAM","EZK","DAN","HOS","JOL","AMO",
          "OBA","JON","MIC","NAM","HAB","ZEP","HAG","ZEC","MAL","MAT","MRK","LUK","JHN","ACT","JAS","1PE",
          "2PE","1JN","2JN","3JN","JUD","ROM","1CO","2CO","GAL","EPH","PHP","COL","1TH","2TH","1TI","2TI",
          "TIT","PHM","HEB","REV"]

          def log(*a): print(*a, flush=True)

          def clean(s):
              return " ".join(str(s).replace("\u00a0", " ").split())

          def fetch(url, timeout=120):
              req = urllib.request.Request(url, headers={"User-Agent": "dvoe-app-build/1.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def fetch_json(url, timeout=120):
              return json.loads(fetch(url, timeout).decode("utf-8", "replace"))

          def count(books):
              return sum(len(c) for b in books for c in b["c"])

          def ok(books):
              return len(books) >= 60 and count(books) >= 25000

          # ---------- нормализаторы ----------

          def from_book_chapters(raw):
              """[{name, chapters: [[стих,...],...]}] или главы объектами"""
              books = []
              if not (isinstance(raw, list) and raw and isinstance(raw[0], dict) and "chapters" in raw[0]):
                  return books
              for i, b in enumerate(raw):
                  name = clean(b.get("name") or b.get("book") or (CANON[i] if i < len(CANON) else "Книга %d" % (i + 1)))
                  chs = []
                  for c in b["chapters"]:
                      if isinstance(c, list):
                          chs.append([clean(v) for v in c])
                      elif isinstance(c, dict):
                          vs = c.get("verses") or []
                          if isinstance(vs, dict):
                              vs = [vs[k] for k in sorted(vs, key=lambda x: int(x))]
                          chs.append([clean(v.get("text") if isinstance(v, dict) else v) for v in vs])
                  books.append({"n": name, "c": chs})
              return books

          def from_flat(raw):
              """[{book|book_number, chapter, verse, text}, ...]"""
              if not (isinstance(raw, list) and raw and isinstance(raw[0], dict) and "text" in raw[0]):
                  return []
              acc, names = {}, {}
              for v in raw:
                  bi = v.get("book") or v.get("book_number") or v.get("book_id") or v.get("bookid")
                  if bi is None:
                      continue
                  try:
                      bi = int(bi)
                  except (TypeError, ValueError):
                      continue
                  nm = v.get("book_name") or v.get("name")
                  if nm:
                      names[bi] = clean(nm)
                  ch, vs = int(v.get("chapter", 1)), int(v.get("verse", 1))
                  acc.setdefault(bi, {}).setdefault(ch, {})[vs] = clean(v.get("text"))
              books = []
              for k in sorted(acc):
                  name = names.get(k) or (CANON[k - 1] if 1 <= k <= len(CANON) else "Книга %s" % k)
                  books.append({"n": name, "c": [[acc[k][c][x] for x in sorted(acc[k][c])] for c in sorted(acc[k])]})
              return books

          USFM_MARK = re.compile(r"\\[a-z0-9\-]+\*?\s?")
          USFM_WORD = re.compile(r"\\w\s+([^|\\]+)(\|[^\\]*)?\\w\*")

          def from_usfm_zip(data):
              """Архив с файлами .usfm — стандартный церковный формат"""
              books = []
              try:
                  zf = zipfile.ZipFile(io.BytesIO(data))
              except Exception as e:
                  log("   архив не читается:", e)
                  return []
              files = [n for n in zf.namelist() if n.lower().endswith((".usfm", ".sfm"))]
              log("   файлов в архиве:", len(files))
              got = {}
              for fn in files:
                  try:
                      txt = zf.read(fn).decode("utf-8", "replace")
                  except Exception:
                      continue
                  m = re.search(r"\\id\s+(\w+)", txt)
                  code = m.group(1).upper() if m else None
                  if code not in USFM_ORDER:
                      continue
                  hm = re.search(r"\\(?:toc2|toc1|h)\s+([^\n\r\\]+)", txt)
                  idx = USFM_ORDER.index(code)
                  name = clean(hm.group(1)) if hm else CANON[idx]
                  body = txt.split("\\c ", 1)
                  if len(body) < 2:
                      continue
                  chapters = []
                  for chunk in ("\\c " + body[1]).split("\\c ")[1:]:
                      verses = []
                      parts = chunk.split("\\v ")
                      for vp in parts[1:]:
                          vm = re.match(r"\s*(\d+[a-z]?)\s*(.*)", vp, re.S)
                          if not vm:
                              continue
                          t = vm.group(2)
                          t = USFM_WORD.sub(r"\1", t)
                          t = re.sub(r"\\f\s.*?\\f\*", "", t, flags=re.S)
                          t = re.sub(r"\\x\s.*?\\x\*", "", t, flags=re.S)
                          t = USFM_MARK.sub(" ", t)
                          verses.append(clean(t))
                      chapters.append(verses)
                  got[idx] = {"n": name, "c": chapters}
              for i in sorted(got):
                  books.append(got[i])
              return books

          # ---------- источники ----------

          def src_thiago():
              return from_book_chapters(fetch_json(
                  "https://raw.githubusercontent.com/thiagobodruk/bible/master/json/ru_synodal.json"))

          def src_thiago_cdn():
              return from_book_chapters(fetch_json(
                  "https://cdn.jsdelivr.net/gh/thiagobodruk/bible@master/json/ru_synodal.json"))

          def src_bolls():
              raw = fetch_json("https://bolls.life/static/translations/SYNO.json")
              b = from_flat(raw)
              return b or from_book_chapters(raw)

          def src_getbible():
              idx = fetch_json("https://api.getbible.net/v2/synodal/books.json")
              nums = [b["nr"] for b in idx] if isinstance(idx, list) else []
              out = []
              for nr in nums:
                  d = fetch_json("https://api.getbible.net/v2/synodal/%s.json" % nr, timeout=60)
                  i = int(nr) - 1
                  name = clean(d.get("name") or (CANON[i] if 0 <= i < len(CANON) else "Книга %s" % nr))
                  acc = {}
                  for v in d.get("verses", []):
                      acc.setdefault(int(v["chapter"]), {})[int(v["verse"])] = clean(v["text"])
                  out.append({"n": name, "c": [[acc[c][x] for x in sorted(acc[c])] for c in sorted(acc)]})
              return out

          def src_ebible():
              return from_usfm_zip(fetch("https://ebible.org/Scriptures/russyn_usfm.zip", timeout=180))

          SOURCES = [
              ("thiagobodruk (github)", src_thiago),
              ("thiagobodruk (jsdelivr)", src_thiago_cdn),
              ("bolls.life", src_bolls),
              ("getbible v2", src_getbible),
              ("eBible.org USFM", src_ebible),
          ]

          def main():
              books, used = [], None
              for name, fn in SOURCES:
                  try:
                      log("Источник:", name)
                      cand = fn()
                      log("   книг: %d, стихов: %d" % (len(cand), count(cand)))
                      if ok(cand):
                          books, used = cand, name
                          break
                      log("   не подходит, пробую следующий")
                  except Exception as e:
                      log("   ошибка:", type(e).__name__, e)

              env = os.environ.get("GITHUB_ENV")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")

              if books:
                  with open("bible.js", "w", encoding="utf-8") as f:
                      f.write("const BIBLE=")
                      json.dump({"books": books}, f, ensure_ascii=False, separators=(",", ":"))
                      f.write(";")
                  mb = os.path.getsize("bible.js") / 1048576.0
                  msg = ("Библия загружена: %d книг, %d глав, %d стихов, %.1f МБ (источник: %s)"
                         % (len(books), sum(len(b["c"]) for b in books), count(books), mb, used))
                  log(msg)
                  log("Первая книга:", books[0]["n"], "| последняя:", books[-1]["n"])
                  for probe in ("Бытие", "Псал", "оанн", "Откров"):
                      hit = next((b for b in books if probe.lower() in b["n"].lower()), None)
                      if hit:
                          log("  %-8s -> %s, глав: %d, стихов в 1-й главе: %d"
                              % (probe, hit["n"], len(hit["c"]), len(hit["c"][0]) if hit["c"] else 0))
              else:
                  with open("bible.js", "w", encoding="utf-8") as f:
                      f.write("/* текст Библии не загрузился при этой сборке */")
                  msg = "Библия НЕ загрузилась — приложение собрано без неё"
                  log(msg)

              if env:
                  with open(env, "a", encoding="utf-8") as f:
                      f.write("BIBLE_STATUS=%s\n" % msg)
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### %s\n" % msg)

          main()
          PYEOF

      - name: Сохранить текст Библии в репозиторий
        run: |
          if [ -s bible.js ] && [ $(stat -c%s bible.js) -gt 1000000 ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f bible.js
            git diff --staged --quiet || git commit -m "Полный текст Библии для сайта [skip ci]"
            git push || echo "не удалось отправить в репозиторий — на сборку APK это не влияет"
          else
            echo "Файл Библии пустой — в репозиторий не отправляю"
          fi

      - name: Создать проект Android
        run: |
          set -e
          mkdir -p android/app/src/main/java/app/dvoe
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cp index.html android/app/src/main/assets/index.html
          cp bible.js  android/app/src/main/assets/bible.js

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dvoe"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'app.dvoe'
              compileSdk 34

              defaultConfig {
                  applicationId "app.dvoe"
                  minSdk 26
                  targetSdk 34
                  versionCode VERSION_CODE_PLACEHOLDER
                  versionName "VERSION_NAME_PLACEHOLDER"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Двое"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/app/dvoe/MainActivity.java <<'EOF'
          package app.dvoe;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView web;
              private TextToSpeech tts;
              private boolean ttsReady = false;

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#FAF6F0"));
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);

                  web.setWebViewClient(new WebViewClient());
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try { tts.setLanguage(new Locale("ru", "RU")); } catch (Exception e) { }
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String id) { }
                                  @Override public void onDone(String id) { js("window.__ttsDone&&window.__ttsDone()"); }
                                  @Override public void onError(String id) { js("window.__ttsDone&&window.__ttsDone()"); }
                                  @Override public void onRangeStart(String id, int start, int end, int frame) {
                                      js("window.__ttsRange&&window.__ttsRange(" + start + "," + end + ")");
                                  }
                              });
                              ttsReady = true;
                          }
                      }
                  });

                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void speakUnit(String text) {
                          if (!ttsReady || text == null) return;
                          if (text.length() > 3800) text = text.substring(0, 3800);
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "dvoe");
                      }

                      @JavascriptInterface
                      public void setRate(float rate) {
                          if (ttsReady && rate > 0.2f && rate < 3f) tts.setSpeechRate(rate);
                      }

                      @JavascriptInterface
                      public void stop() { if (ttsReady) tts.stop(); }
                  }, "AndroidTTS");

                  if (savedInstanceState == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(savedInstanceState);
                  }
              }

              private void js(final String code) {
                  runOnUiThread(new Runnable() {
                      @Override public void run() {
                          try { web.evaluateJavascript(code, null); } catch (Exception e) { }
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "(function(){try{return window.__handleBack?window.__handleBack():false}catch(e){return false}})()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String value) {
                              if (!"true".equals(value)) {
                                  MainActivity.super.onBackPressed();
                              }
                          }
                      });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (ttsReady) tts.stop();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }
          }
          EOF

          cat > android/app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#4A3524"/>
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M46,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0"
                  android:strokeColor="#E8C89A" android:strokeWidth="5"
                  android:fillColor="#00000000"/>
              <path android:pathData="M62,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0"
                  android:strokeColor="#D9A3B8" android:strokeWidth="5"
                  android:fillColor="#00000000"/>
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          sed -i "s/VERSION_CODE_PLACEHOLDER/${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/VERSION_NAME_PLACEHOLDER/5.${GITHUB_RUN_NUMBER}/" android/app/build.gradle

          echo "Структура проекта:"
          find android -type f | sort
          echo "Размер файла Библии:"
          du -h android/app/src/main/assets/bible.js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Подготовить файл
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/dvoe.apk
          ls -lh out

      - name: Приложить APK к сборке
        uses: actions/upload-artifact@v4
        with:
          name: dvoe-apk
          path: out/dvoe.apk
          retention-days: 90

      - name: Опубликовать в разделе Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Двое — установочный файл
          body: |
            Приложение «Двое» для Android.

            Как установить:
            1. Скачайте файл dvoe.apk на телефон.
            2. Откройте его. Android спросит разрешение установить
               приложение из этого источника — разрешите.
            3. Иконка появится на рабочем столе.

            Интернет не нужен: все тексты и полная Библия внутри приложения.

            ${{ env.BIBLE_STATUS }}
          files: out/dvoe.apk
          make_latest: true
